<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Blog preview card</title>

    <!-- Feel free to remove these styles or customize in your own stylesheet 👍 -->
    <style>
      * {
        /* border: 1px solid black; */
        padding: 0.5rem;
        border-radius: 1rem;
        margin: auto;
      }
      body {
        background-color: hsl(47, 88%, 63%);
      }
      .main {
        max-width: 1440px;

        display: flex;
        height: 100vh;
      }
      .card {
        background-color: hsl(0, 0%, 100%);
        width: 20rem;
        border-radius: 1.5rem;
        box-shadow:;
      }
      .card img {
        width: 17rem;
        margin: auto;
      }
      .batch {
        background-color: hsl(47, 88%, 63%);
        font-weight: 600;
        display: inline;
        border-radius: 0.4rem;
      }
      .date {
        font-weight: 500;
      }

      .card-title:hover {
        color: hsl(47, 88%, 63%);
      }
      .description {
        color: hsl(0, 0%, 42%);
        text-align: justify;
      }
      .profile {
        display: flex;
      }
      h4 {
        text-align: right;
      }

      .profile img {
        width: 3rem;
      }

      .attribution {
        font-size: 0.9rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }

      @media screen and (max-width: 375px) {
        body {
          background-color: lightgreen;
        }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <div class="card">
        <img src="./assets/images/illustration-article.svg" alt="card-img" />
        <div class="batch">Learning</div>
        <div class="date">Published 21 Dec 2023</div>
        <h2 class="card-title">HTML & CSS foundations</h2>
        <p class="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="profile">
          <img src="./assets/images/image-avatar.webp" alt="profile-pic" />
          <h4>Greg Hooper</h4>
        </div>
      </div>
    </div>

    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by
      <a href="https://www.frontendmentor.io/profile/MSabbirHossen"
        >Md Sabbir Hossen</a
      >.
    </div>
  </body>
</html>
